<!DOCTYPE html>
<html>

<head>
    <title>Raw SSE Demo</title>
</head>

<body>

    <h1>Live Price</h1>

    <h2 id="price">Waiting...</h2>

    <canvas id="chart" width="700" height="300"></canvas>

    <div id="log"></div>


    <script>

        // -----------------------------
        // GRAPH SETUP
        // -----------------------------

        const prices = [];

        const canvas = document.getElementById("chart");
        const ctx = canvas.getContext("2d");
function drawGraph() {

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (prices.length < 2) {
        return;
    }

    const min = Math.min(...prices);
    const max = Math.max(...prices);

    // Graph line
    ctx.beginPath();

    prices.forEach((price, i) => {

        const x =
            (i / (prices.length - 1)) *
            canvas.width;

        const y =
            canvas.height -
            ((price - min) / (max - min || 1)) *
            canvas.height;

        if (i === 0) {
            ctx.moveTo(x, y);
        } else {
            ctx.lineTo(x, y);
        }
    });

    ctx.strokeStyle = "blue";
    ctx.lineWidth = 3;

    ctx.stroke();
}

        // -----------------------------
        // SSE CONNECTION
        // -----------------------------

        async function connectSSE() {

            const response = await fetch("/events");

            const reader = response.body.getReader();

            const decoder = new TextDecoder();

            let buffer = "";


            while (true) {

                const { value, done } =
                    await reader.read();


                if (done) {

                    console.log("Connection closed");

                    break;
                }


                // Bytes → text
                const chunk =
                    decoder.decode(value, {
                        stream: true
                    });


                console.log("RAW CHUNK:", chunk);


                // Add chunk to buffer
                buffer += chunk;


                // SSE event separator
                while (buffer.includes("\n\n")) {

                    const separatorIndex =
                        buffer.indexOf("\n\n");


                    // Extract complete event
                    const event =
                        buffer.substring(
                            0,
                            separatorIndex
                        );


                    // Remove processed event
                    buffer =
                        buffer.substring(
                            separatorIndex + 2
                        );


                    console.log(
                        "COMPLETE EVENT:",
                        event
                    );


                    // Find data line
                    const dataLine =
                        event
                            .split("\n")
                            .find(line =>
                                line.startsWith("data: ")
                            );


                    if (!dataLine) {
                        continue;
                    }


                    // Remove "data: "
                    const json =
                        dataLine.substring(6);


                    // JSON → JavaScript object
                    const data =
                        JSON.parse(json);


                    // -----------------------------
                    // UPDATE PRICE
                    // -----------------------------

                    document.getElementById("price")
                        .innerText =
                        "$" + data.price;


                    // -----------------------------
                    // STORE PRICE FOR GRAPH
                    // -----------------------------

                    prices.push(data.price);


                    // Keep only latest 30 points
                    if (prices.length > 30) {
                        prices.shift();
                    }


                    // Redraw graph
                    drawGraph();


                    // -----------------------------
                    // LOG
                    // -----------------------------

                    document.getElementById("log")
                        .innerHTML +=
                        `<p>${data.time} → ${data.price}</p>`;
                }
            }
        }


        connectSSE();

    </script>

</body>

</html>
